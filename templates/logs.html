{% extends "layout.html" %}
{% block content %}
<h2><i class="bi bi-clock-history"></i> Request Logs</h2>
<form method="GET" class="row g-3 mt-2">
    <div class="col-md-3">
        <label for="key_filter" class="form-label">Filter by Key</label>
        <select class="form-select" id="key_filter" name="key_id">
            <option value="">All Keys</option>
            {% for k in keys %}
            <option value="{{ k.id }}" {% if selected_key|string == k.id|string %}selected{% endif %}>{{ k.key_name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-3">
        <label for="tool_filter" class="form-label">Filter by Tool</label>
        <select class="form-select" id="tool_filter" name="tool">
            <option value="">All Tools</option>
            {% for t in tools %}
            <option value="{{ t }}" {% if selected_tool == t %}selected{% endif %}>{{ t }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2 d-flex align-items-end">
        <button type="submit" class="btn btn-primary"><i class="bi bi-funnel"></i> Filter</button>
    </div>
</form>
<div class="table-responsive mt-3">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>ID</th>
                <th>Key</th>
                <th>Tool</th>
                <th>Parameters</th>
                <th>Status</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody>
            {% for log in logs %}
            <tr>
                <td>{{ log.id }}</td>
                <td>{{ log.key_name or 'Deleted' }}</td>
                <td>{{ log.tool }}</td>
                <td>{{ log.parameters }}</td>
                <td>
                    <span class="badge bg-{{ 'success' if log.response_status < 400 else 'danger' }}">
                        {{ log.response_status }}
                    </span>
                </td>
                <td>{{ log.timestamp }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
