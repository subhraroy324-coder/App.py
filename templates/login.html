<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SHAYAN_EXPLORER | Secure Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <div class="login-card glass-3d">
        <h2>SHAYAN_EXPLORER</h2>
        <p>OSINT Gateway Authentication</p>
        {% if error %}<div class="alert-error">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username (vernex)" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn-3d">Initialize Session</button>
        </form>
    </div>
</body>
</html>
