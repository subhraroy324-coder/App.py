{% extends "layout.html" %}
{% block content %}
<h2><i class="bi bi-link-45deg"></i> Endpoint Generator</h2>
<div class="row mt-3">
    <div class="col-md-4">
        <label for="tool_select" class="form-label">Select Tool</label>
        <select class="form-select" id="tool_select" onchange="updateExample()">
            {% for tool in tools %}
            <option value="{{ tool }}" {% if tool == selected_tool %}selected{% endif %}>{{ tool }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-8">
        <label class="form-label">Example URL</label>
        <div class="input-group">
            <input type="text" class="form-control" id="example_url" value="{{ example_url }}" readonly>
            <button class="btn btn-outline-secondary" type="button" onclick="copyUrl()"><i class="bi bi-clipboard"></i> Copy</button>
        </div>
        <small class="text-muted">Replace <code>YOUR_API_KEY</code> with your generated key and <code>VALUE</code> with actual parameters.</small>
    </div>
</div>
<script>
function updateExample() {
    const tool = document.getElementById('tool_select').value;
    window.location.href = "{{ url_for('endpoint') }}?tool=" + tool;
}
function copyUrl() {
    const urlInput = document.getElementById('example_url');
    urlInput.select();
    document.execCommand('copy');
    alert('URL copied to clipboard!');
}
</script>
{% endblock %}
