{% extends "layout.html" %}
{% block content %}
<h2><i class="bi bi-pencil"></i> Edit Key: {{ key.key_name }}</h2>
<form method="POST" class="mt-3">
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label for="key_name" class="form-label">Key Name</label>
                <input type="text" class="form-control" id="key_name" name="key_name" value="{{ key.key_name }}" required>
            </div>
            <div class="mb-3">
                <label for="expiry_date" class="form-label">Expiry Date</label>
                <input type="date" class="form-control" id="expiry_date" name="expiry_date" 
                       value="{{ key.expiry_date.split('T')[0] if key.expiry_date else '' }}">
            </div>
            <div class="mb-3">
                <label for="expiry_time" class="form-label">Expiry Time</label>
                <input type="time" class="form-control" id="expiry_time" name="expiry_time"
                       value="{{ key.expiry_date.split('T')[1][:5] if key.expiry_date else '' }}">
            </div>
            <div class="mb-3">
                <label for="request_limit" class="form-label">Request Limit (leave empty for unlimited)</label>
                <input type="number" class="form-control" id="request_limit" name="request_limit" value="{{ key.request_limit or '' }}">
            </div>
            <div class="mb-3">
                <label for="status" class="form-label">Status</label>
                <select class="form-select" id="status" name="status">
                    <option value="active" {% if key.status == 'active' %}selected{% endif %}>Active</option>
                    <option value="suspended" {% if key.status == 'suspended' %}selected{% endif %}>Suspended</option>
                </select>
            </div>
        </div>
        <div class="col-md-6">
            <label class="form-label">Allowed APIs (select none for all)</label>
            <div class="border p-3 rounded" style="max-height: 300px; overflow-y: auto;">
                {% for tool in tools %}
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="allowed_apis" value="{{ tool }}" id="tool_{{ tool }}"
                           {% if tool in selected %}checked{% endif %}>
                    <label class="form-check-label" for="tool_{{ tool }}">
                        {{ tool }}
                    </label>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
    <button type="submit" class="btn btn-primary mt-3"><i class="bi bi-save"></i> Update Key</button>
    <a href="{{ url_for('keys') }}" class="btn btn-secondary mt-3">Cancel</a>
</form>
{% endblock %}
